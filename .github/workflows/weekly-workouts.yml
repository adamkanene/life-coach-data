name: Weekly Workouts

# Saturday 11:30 PM Central = Sunday 05:30 UTC while on standard time (CST).
# During daylight time (CDT, Mar-Nov) this fires at 12:30 AM Sunday instead.
on:
  schedule:
    - cron: '30 5 * * 0'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build shareable summary of the week that's ending
        run: python scripts/weekly_summary.py

      - name: Generate next week's workouts
        run: python scripts/generate_week.py

      - name: Commit and push if changed
        run: |
          git config user.name "weekly-workouts-bot"
          git config user.email "weekly-workouts-bot@users.noreply.github.com"
          git add data/weekly-workouts.json data/weekly-summary.json 2>/dev/null || git add data/weekly-workouts.json
          if git diff --cached --quiet; then
            echo "No changes - skipping commit."
          else
            git commit -m "Weekly workouts: $(date -u +%Y-%m-%d)"
            git push
          fi
