<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Life Coach Dashboard</title>

<!-- PWA-ish -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Life Coach">
<meta name="theme-color" content="#0b0d12">
<link rel="manifest" href='data:application/manifest+json,{"name":"Life Coach Dashboard","short_name":"LifeCoach","start_url":".","display":"standalone","background_color":"%230b0d12","theme_color":"%230b0d12","icons":[]}'>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%2316a34a'/%3E%3Ctext x='50' y='65' font-size='55' text-anchor='middle' fill='white' font-family='sans-serif'%3ELC%3C/text%3E%3C/svg%3E">

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.0/chart.umd.min.js"></script>

<style>
  :root{
    --bg:#0b0d12;
    --card:#151822;
    --card2:#1b1f2b;
    --border:#252a38;
    --text:#eef1f7;
    --muted:#8b93a7;
    --accent:#22c55e;
    --accent2:#3b82f6;
    --warn:#f59e0b;
    --bad:#ef4444;
    --protein:#22c55e;
    --carbs:#3b82f6;
    --fat:#f59e0b;
    --kcal:#a78bfa;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  body{
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    padding-bottom: 32px;
  }
  header{
    position:sticky; top:0; z-index:10;
    background:rgba(11,13,18,0.9); backdrop-filter:blur(10px);
    padding:16px 16px 10px; border-bottom:1px solid var(--border);
  }
  header h1{margin:0; font-size:19px; font-weight:700;}
  header .sub{color:var(--muted); font-size:12.5px; margin-top:3px;}
  .wrap{padding:14px; max-width:640px; margin:0 auto;}
  section{margin-bottom:22px;}
  .section-title{
    font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:0.06em;
    color:var(--muted); margin:0 0 10px 4px;
  }
  .card{
    background:var(--card); border:1px solid var(--border); border-radius:16px;
    padding:16px; margin-bottom:12px;
  }
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}

  /* Rings */
  .ring-row{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;}
  .ring{position:relative; width:104px; height:104px; flex:0 0 auto;}
  .ring svg{transform:rotate(-90deg);}
  .ring-label{
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  .ring-label .val{font-size:17px; font-weight:800;}
  .ring-label .tgt{font-size:10.5px; color:var(--muted);}
  .ring-cap{text-align:center; font-size:11.5px; color:var(--muted); margin-top:6px; text-transform:uppercase; letter-spacing:.04em;}

  .macro-bars{display:flex; flex-direction:column; gap:12px; margin-top:14px;}
  .macro-bar-row{}
  .macro-bar-row .top{display:flex; justify-content:space-between; font-size:12.5px; margin-bottom:5px;}
  .macro-bar-row .top .name{color:var(--text); font-weight:600;}
  .macro-bar-row .top .nums{color:var(--muted);}
  .bar-track{background:var(--card2); border-radius:8px; height:9px; overflow:hidden;}
  .bar-fill{height:100%; border-radius:8px; transition:width .4s ease;}

  .meal-item{
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    padding:10px 0; border-bottom:1px solid var(--border);
  }
  .meal-item:last-child{border-bottom:none;}
  .meal-item .desc{font-size:14px; font-weight:600;}
  .meal-item .time{font-size:11px; color:var(--muted); margin-top:2px;}
  .meal-item .kcal{font-size:14px; font-weight:700; color:var(--kcal); white-space:nowrap;}
  .meal-item .macros{font-size:11px; color:var(--muted); margin-top:2px;}

  .empty{
    text-align:center; color:var(--muted); padding:28px 12px; font-size:13.5px;
  }
  .empty .emoji{font-size:26px; display:block; margin-bottom:8px;}

  canvas{max-width:100%;}
  .chart-wrap{position:relative; height:200px;}
  .chart-wrap.tall{height:230px;}
  .chart-wrap.short{height:120px;}

  .legend{display:flex; gap:14px; flex-wrap:wrap; margin-top:10px; font-size:11.5px; color:var(--muted);}
  .legend span{display:inline-flex; align-items:center; gap:5px;}
  .dot{width:8px; height:8px; border-radius:50%; display:inline-block;}

  .stat-pill{
    background:var(--card2); border-radius:12px; padding:10px 12px; text-align:center;
  }
  .stat-pill .num{font-size:18px; font-weight:800;}
  .stat-pill .lbl{font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; margin-top:2px;}

  .phase-tag{
    display:inline-block; background:rgba(34,197,94,0.12); color:var(--accent);
    border:1px solid rgba(34,197,94,0.35); border-radius:999px; padding:3px 10px;
    font-size:11.5px; font-weight:700;
  }

  .type-tag{
    display:inline-block; padding:4px 10px; border-radius:999px;
    font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.03em;
    white-space:nowrap;
  }
  .type-strength{ background:rgba(34,197,94,0.12); color:var(--accent); border:1px solid rgba(34,197,94,0.35); }
  .type-cardio{ background:rgba(59,130,246,0.12); color:var(--accent2); border:1px solid rgba(59,130,246,0.35); }
  .type-rest{ background:rgba(139,147,167,0.12); color:var(--muted); border:1px solid rgba(139,147,167,0.35); }

  .workout-item{
    display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--border); font-size:13.5px;
  }
  .workout-item:last-child{border-bottom:none;}
  .workout-item .t{font-weight:600;}
  .workout-item .m{color:var(--muted);}


  /* Tabs + Workouts view */
  .tabs{display:flex; gap:6px; margin-top:10px;}
  .tab-btn{flex:1; background:var(--card2); color:var(--muted); border:1px solid var(--border); border-radius:10px;
    padding:8px 10px; font-size:13px; font-weight:700; cursor:pointer;}
  .tab-btn.active{background:rgba(34,197,94,0.14); color:var(--accent); border-color:rgba(34,197,94,0.45);}
  .chips{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:12px;}
  .chip{background:var(--card); border:1px solid var(--border); border-radius:12px; padding:9px 6px; text-align:center;
    color:var(--text); cursor:pointer; font:inherit;}
  .chip .n{font-size:15px; font-weight:800;}
  .chip .l{font-size:10.5px; color:var(--muted); margin-top:2px; line-height:1.25;}
  .chip.active{border-color:var(--accent); background:rgba(34,197,94,0.10);}
  .chip.done .n::after{content:" \2713"; color:var(--accent);}
  .lift-block{margin-bottom:16px;}
  .lift-block:last-child{margin-bottom:0;}
  .lift-head{display:flex; justify-content:space-between; align-items:baseline; gap:8px; margin-bottom:6px;}
  .lift-head .nm{font-size:15px; font-weight:700;}
  .lift-head .rest{font-size:11.5px; color:var(--muted); white-space:nowrap;}
  table.sets{width:100%; border-collapse:collapse; font-size:13.5px; table-layout:fixed;}
  table.sets th:nth-child(1){width:52%;} table.sets th:nth-child(2){width:18%;}
  table.sets th{text-align:left; color:var(--muted); font-size:10.5px; text-transform:uppercase; letter-spacing:.04em;
    font-weight:700; padding:4px 0; border-bottom:1px solid var(--border);}
  table.sets td{padding:7px 0; border-bottom:1px solid var(--border);}
  table.sets td.lb{font-weight:800; text-align:right;}
  table.sets th.r{text-align:right;}
  table.sets tr.grp td{color:var(--accent2); font-size:11px; font-weight:700; text-transform:uppercase;
    letter-spacing:.04em; padding-top:10px; border-bottom:none;}
  .note{font-size:12.5px; color:var(--muted); margin-top:6px;}
  .record{margin-top:6px; font-size:12.5px; color:var(--warn); font-weight:600;}
  .wk-head{display:flex; justify-content:space-between; align-items:center; gap:10px;}
  .wk-head .t{font-size:17px; font-weight:800;}
  .wk-head .d{font-size:12px; color:var(--muted); margin-top:2px;}
  .done-btn{width:100%; margin-top:4px; padding:11px; border-radius:12px; border:1px solid var(--border);
    background:var(--card2); color:var(--text); font-size:14px; font-weight:700; cursor:pointer;}
  .done-btn.on{background:rgba(34,197,94,0.14); color:var(--accent); border-color:rgba(34,197,94,0.45);}
  .rules{margin:0; padding-left:18px; font-size:12.5px; color:var(--muted); line-height:1.5;}
  .open-wk{margin-top:12px; width:100%; padding:10px; border-radius:12px; border:1px solid rgba(34,197,94,0.45);
    background:rgba(34,197,94,0.10); color:var(--accent); font-weight:700; font-size:13.5px; cursor:pointer;}


  table.sets.log th:nth-child(1){width:13%;} table.sets.log th:nth-child(2){width:15%;}
  table.sets.log th:nth-child(3){width:28%;} table.sets.log th:nth-child(4){width:24%;}
  table.sets.log td{padding:5px 0;}
  table.sets tr.ok td{color:var(--accent);}
  table.sets tr.desc td{color:var(--text); font-weight:600; border-bottom:none; padding-top:8px;}
  .in{background:var(--card2); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:6px 8px;
    font-size:15px; width:88%; font-family:inherit;}
  .in.tok{width:100%; margin-top:8px;}
  .in.rec{width:80px; display:inline-block;}
  .tick{width:34px; height:34px; border-radius:10px; border:1px solid var(--border); background:var(--card2);
    color:var(--accent); font-size:17px; font-weight:800; cursor:pointer; float:right;}
  .tick.on{background:rgba(34,197,94,0.18); border-color:rgba(34,197,94,0.55);}
  .add{background:none; border:1px dashed var(--border); color:var(--muted); border-radius:8px; padding:6px 10px;
    font-size:12.5px; cursor:pointer; margin:4px 0;}
  .save-btn{width:100%; margin-top:14px; padding:11px; border-radius:12px; border:1px solid rgba(34,197,94,0.45);
    background:rgba(34,197,94,0.14); color:var(--accent); font-size:14px; font-weight:700; cursor:pointer;}
  .save-btn:disabled{opacity:.5; cursor:default;}
  .link-btn{background:none; border:none; color:var(--muted); text-decoration:underline; font-size:12px; padding:6px 0; cursor:pointer;}

  .share-txt{white-space:pre-wrap; font-family:inherit; font-size:13.5px; line-height:1.5; margin:8px 0 0;
    background:var(--card2); border:1px solid var(--border); border-radius:10px; padding:10px 12px; color:var(--text);}
  .share-row{display:flex; gap:8px;} .share-row .save-btn{margin-top:10px;}

  .footer-note{text-align:center; color:var(--muted); font-size:11px; margin-top:18px;}
</style>
</head>
<body>

<header>
  <h1 id="headerName">Life Coach</h1>
  <div class="sub" id="headerSub">Loading…</div>
  <div class="tabs" role="tablist">
    <button class="tab-btn active" data-view="home" role="tab">Dashboard</button>
    <button class="tab-btn" data-view="workouts" role="tab">Workouts</button>
  </div>
</header>

<div class="wrap" id="viewWorkouts" hidden>
  <div id="workoutsBody"><div class="card"><div class="empty"><span class="emoji">⏳</span>Loading this week's workouts…</div></div></div>
</div>

<div class="wrap" id="viewHome">

  <!-- TODAY -->
  <section>
    <div class="section-title">Today</div>
    <div class="card" id="todayCard">
      <div class="empty"><span class="emoji">⏳</span>Loading today's data…</div>
    </div>
  </section>

  <!-- TRAINING -->
  <section>
    <div class="section-title">Training</div>
    <div class="card" id="todayWorkoutCard" style="display:none;">
      <div style="font-size:13px; font-weight:700; margin-bottom:10px;">Today's Workout</div>
      <div id="todayWorkoutBody"></div>
    </div>
    <div class="card" id="trainingCard">
      <div class="empty"><span class="emoji">🏋️</span>No workouts logged yet</div>
    </div>
    <div class="card" id="liftCard">
      <div style="font-size:13px; font-weight:700; margin-bottom:10px;">Strength Progression</div>
      <div id="liftBody"></div>
    </div>
    <div class="card" id="hrCard" style="display:none;">
      <div style="font-size:13px; font-weight:700; margin-bottom:6px;">Resting Heart Rate</div>
      <div class="chart-wrap short"><canvas id="hrChart"></canvas></div>
    </div>
  </section>

  <!-- 14 DAY TRENDS -->
  <section>
    <div class="section-title">14-Day Trends</div>
    <div class="card">
      <div style="font-size:13px; font-weight:700; margin-bottom:6px;">Calories vs Target</div>
      <div class="chart-wrap"><canvas id="kcalChart"></canvas></div>
    </div>
    <div class="card">
      <div style="font-size:13px; font-weight:700; margin-bottom:6px;">Protein vs Target</div>
      <div class="chart-wrap"><canvas id="proteinChart"></canvas></div>
    </div>
  </section>

  <!-- WEIGHT -->
  <section>
    <div class="section-title">Weight</div>
    <div class="card" id="weightCard">
      <div class="empty"><span class="emoji">⚖️</span>No weight data yet</div>
    </div>
  </section>

  <!-- MEALS LOGGED TODAY -->
  <section>
    <div class="section-title">Meals Logged Today</div>
    <div class="card" id="mealsCard" style="display:none;">
      <div id="mealsList"></div>
    </div>
  </section>

  <div class="footer-note" id="lastUpdated"></div>

</div>

<script>
(function(){

  // Fallback stub: if Chart.js failed to load, render everything except charts
  if(!window.Chart){
    window.Chart = function(ctx){
      const el = ctx && ctx.parentElement ? ctx.parentElement : null;
      if(el) el.innerHTML = '<div class="empty">Chart library failed to load</div>';
    };
    window.Chart.defaults = {font:{}};
  }

  const CHART_COLORS = {
    kcal: '#a78bfa',
    kcalTarget: '#6b7280',
    protein: '#22c55e',
    proteinTarget: '#6b7280',
    carbs: '#3b82f6',
    fat: '#f59e0b',
    weight: '#3b82f6',
    weightMA: '#22c55e',
    hr: '#ef4444',
    bench: '#22c55e',
    squat: '#3b82f6',
    deadlift: '#a78bfa',
    incline: '#f472b6',
    ohp: '#f59e0b'
  };

  const MAIN_LIFTS = ['bench', 'squat', 'deadlift', 'ohp', 'incline'];
  const LIFT_LABELS = {bench: 'Bench', squat: 'Squat', deadlift: 'Deadlift', ohp: 'OHP'};

  const PHASE_NAMES = {
    base_bulk: 'Lean Bulk',
    aggressive_bulk: 'Bulk',
    shred: 'Cut',
    summer_maintain: 'Maintenance'
  };

  function phaseDisplayName(key){
    if(!key) return '';
    if(PHASE_NAMES[key]) return PHASE_NAMES[key];
    return String(key).replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
  }

  Chart.defaults.color = '#8b93a7';
  Chart.defaults.font.family = "-apple-system, BlinkMacSystemFont, sans-serif";
  Chart.defaults.font.size = 11;

  function cacheBust(url){ return url + (url.includes('?') ? '&' : '?') + 't=' + Date.now(); }

  async function fetchJSON(path, fallback){
    try{
      const res = await fetch(cacheBust(path), {cache:'no-store'});
      if(!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      return data;
    }catch(e){
      console.warn('Failed to load', path, e);
      return fallback;
    }
  }

  function todayStr(){
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,'0');
    const day = String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
  }

  function daysAgoStr(n){
    const d = new Date();
    d.setDate(d.getDate() - n);
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,'0');
    const day = String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
  }

  function fmtDateShort(dstr){
    const d = new Date(dstr + 'T00:00:00');
    return d.toLocaleDateString(undefined, {month:'short', day:'numeric'});
  }

  function weekdayShort(dstr){
    const d = new Date(dstr + 'T00:00:00');
    return d.toLocaleDateString(undefined, {weekday:'short'});
  }

  const WEEKDAY_KEYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

  function todayWeekdayKey(){
    return WEEKDAY_KEYS[new Date().getDay()];
  }

  function startOfWeekStr(){
    // Monday as start of week
    const d = new Date();
    const day = d.getDay(); // 0 Sun .. 6 Sat
    const diff = (day === 0 ? -6 : 1) - day;
    d.setDate(d.getDate() + diff);
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,'0');
    const dd = String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${dd}`;
  }

  function ringSVG(pct, color, size=104, stroke=10){
    pct = Math.max(0, Math.min(pct, 100));
    const r = (size - stroke) / 2;
    const c = 2 * Math.PI * r;
    const offset = c - (pct/100) * c;
    return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#1b1f2b" stroke-width="${stroke}"/>
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}"
        stroke-dasharray="${c}" stroke-dashoffset="${offset}" stroke-linecap="round"/>
    </svg>`;
  }

  function clampPct(v, t){ if(!t) return 0; return Math.min(100, Math.max(0, (v/t)*100)); }

  async function init(){
    const [profile, foodLog, weightLog, healthDaily, trainingPlan, liftLog, weeklyWorkouts, weeklySummary] = await Promise.all([
      fetchJSON('./data/profile.json', null),
      fetchJSON('./data/food-log.json', []),
      fetchJSON('./data/weight-log.json', []),
      fetchJSON('./data/health-daily.json', []),
      fetchJSON('./data/training-plan.json', null).then(async p => { const o = await fetchJSON('./data/daily-overrides.json', {}); const d = new Date(), k = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; if(p && o && o[k]){ p.week[todayWeekdayKey()] = o[k]; if(o[k].notes) p.notes = o[k].notes; } return p; }),
      fetchJSON('./data/lift-log.json', []),
      fetchJSON('./data/weekly-workouts.json', null),
      fetchJSON('./data/weekly-summary.json', null)
    ]);

    renderHeader(profile);
    renderToday(profile, foodLog);
    setupTabs();
    const progWeek = currentProgramWeek(weeklyWorkouts);
    SUMMARY = weeklySummary && weeklySummary.weeks ? weeklySummary.weeks[weeklySummary.latest_week_start] : null;
    renderWorkouts(progWeek, liftLog);
    renderTodayWorkout(trainingPlan, progWeek);
    renderTraining(healthDaily, trainingPlan);
    renderLifts(liftLog);
    renderTrends(profile, foodLog);
    renderWeight(profile, weightLog);

    document.getElementById('lastUpdated').textContent =
      'Updated ' + new Date().toLocaleString(undefined, {month:'short', day:'numeric', hour:'numeric', minute:'2-digit'});
  }

  function getActivePhase(profile){
    if(!profile || !profile.phases || !profile.current_phase) return null;
    return profile.phases[profile.current_phase] || null;
  }

  function renderHeader(profile){
    const nameEl = document.getElementById('headerName');
    const subEl = document.getElementById('headerSub');
    if(!profile){
      nameEl.textContent = 'Life Coach';
      subEl.textContent = 'Could not load profile';
      return;
    }
    nameEl.textContent = profile.name ? `${profile.name}'s Dashboard` : 'Life Coach';
    const phase = getActivePhase(profile);
    let sub = '';
    const age = profile.age || (profile.athlete && profile.athlete.age);
    const wt = profile.weight_lb || (profile.athlete && profile.athlete.starting_weight_lb);
    if(age) sub += `${age}y`;
    if(wt) sub += (sub?' · ':'') + `${wt} lb`;
    if(profile.current_phase) sub += (sub?' · ':'') + `Phase: ${phaseDisplayName(profile.current_phase)}`;
    if(phase && phase.window) sub += ` (${phase.window})`;
    subEl.textContent = sub || 'Welcome back';
  }

  function renderToday(profile, foodLog){
    const card = document.getElementById('todayCard');
    const phase = getActivePhase(profile);
    const today = todayStr();
    const todaysMeals = (foodLog || []).filter(m => m.date === today);

    if(!phase){
      card.innerHTML = `<div class="empty"><span class="emoji">🎯</span>No active phase/targets set in profile.json</div>`;
    } else {
      const targets = phase.targets || phase;
      const totals = todaysMeals.reduce((acc, m) => {
        acc.kcal += Number(m.kcal)||0;
        acc.protein_g += Number(m.protein_g)||0;
        acc.carbs_g += Number(m.carbs_g)||0;
        acc.fat_g += Number(m.fat_g)||0;
        return acc;
      }, {kcal:0, protein_g:0, carbs_g:0, fat_g:0});

      const kcalPct = clampPct(totals.kcal, targets.kcal);

      card.innerHTML = `
        <div class="ring-row">
          <div style="flex:1; min-width:120px;">
            <div class="ring" style="margin:0 auto;">
              ${ringSVG(kcalPct, CHART_COLORS.kcal)}
              <div class="ring-label">

  function escapeHtml(str){

  function last14Days(){

  function epley(weight, reps){
    return Math.round((Number(weight) || 0) * (1 + (Number(reps) || 0) / 30));
  }

  function subtractDaysStr(dstr, n){
    const d = new Date(dstr + 'T00:00:00');
    d.setDate(d.getDate() - n);
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,'0');
    const day = String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
  }

  function renderLifts(liftLog){
    const body = document.getElementById('liftBody');
    const log = liftLog || [];

    if(log.length === 0){
      body.innerHTML = `<div class="empty"><span class="emoji">💪</span>No lifts logged yet — text your coach "bench 185x8"</div>`;
      return;
    }

    const cutoff = daysAgoStr(90);
    const recent = log.filter(r => r && r.date >= cutoff);

    // Best (max) e1RM per exercise per date
    const byExerciseDate = {};
    recent.forEach(r => {
      const ex = String(r.exercise || '').toLowerCase();
      if(!ex || !r.date) return;
      const e1rm = epley(r.weight_lb, r.reps);
      if(!byExerciseDate[ex]) byExerciseDate[ex] = {};
      if(byExerciseDate[ex][r.date] == null || e1rm > byExerciseDate[ex][r.date]){
        byExerciseDate[ex][r.date] = e1rm;
      }
    });

    const presentMainLifts = MAIN_LIFTS.filter(ex => byExerciseDate[ex] && Object.keys(byExerciseDate[ex]).length);

    if(presentMainLifts.length === 0){
      body.innerHTML = `<div class="empty"><span class="emoji">💪</span>No lifts logged yet — text your coach "bench 185x8"</div>`;
      return;
    }

    const allDatesSet = new Set();
    presentMainLifts.forEach(ex => Object.keys(byExerciseDate[ex]).forEach(d => allDatesSet.add(d)));
    const allDates = [...allDatesSet].sort();
    const labels = allDates.map(fmtDateShort);

    const pillsHtml = presentMainLifts.map(ex => {
      const dates = Object.keys(byExerciseDate[ex]).sort();
      const latestDate = dates[dates.length - 1];
      const current = byExerciseDate[ex][latestDate];

      const targetDate = subtractDaysStr(latestDate, 30);
      const priorDates = dates.filter(d => d <= targetDate);
      let deltaHtml = '';
      if(priorDates.length){
        const priorDate = priorDates[priorDates.length - 1];
        const prior = byExerciseDate[ex][priorDate];
        const delta = current - prior;
        if(delta > 0){
          deltaHtml = `<div style="font-size:11px; margin-top:2px; color:${CHART_COLORS.protein};">▲ ${delta}</div>`;
        } else if(delta < 0){
          deltaHtml = `<div style="font-size:11px; margin-top:2px; color:var(--bad);">▼ ${Math.abs(delta)}</div>`;
        } else {
          deltaHtml = `<div style="font-size:11px; margin-top:2px; color:var(--muted);">— 0</div>`;
        }
      }

      return `
        <div class="stat-pill" style="flex:1; min-width:80px;">
          <div class="num">${current}</div>
          <div class="lbl">${escapeHtml(LIFT_LABELS[ex])} e1RM</div>
          ${deltaHtml}
        </div>
      `;
    }).join('');

    body.innerHTML = `
      <div style="display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px;">${pillsHtml}</div>
      <div class="chart-wrap tall"><canvas id="liftChart"></canvas></div>
    `;

    const datasets = presentMainLifts.map(ex => ({
      label: LIFT_LABELS[ex],
      data: allDates.map(d => byExerciseDate[ex][d] != null ? byExerciseDate[ex][d] : null),
      borderColor: CHART_COLORS[ex],
      backgroundColor: CHART_COLORS[ex] + '33',
      fill: false,
      tension: 0.3,
      spanGaps: true,
      pointRadius: 2.5
    }));

    new Chart(document.getElementById('liftChart'), {
      type: 'line',
      data: { labels, datasets },
      options: baseLineOptions()
    });
  }

  function store(k, v){ try{ if(v === undefined) return localStorage.getItem(k); if(v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); }catch(e){ return null; } }
  function isDone(w, id){ return store(`lc.done.${w.week_start}.${id}`) === '1'; }
  function loadDraft(w, sid){ try{ return JSON.parse(store(`lc.log.${w.week_start}.${sid}`) || '{}') || {}; }catch(e){ return {}; } }

  function currentProgramWeek(ww){
    if(!ww || !ww.weeks) return null;
    const today = todayStr();
    const weeks = Object.values(ww.weeks).sort((a,b) => a.week_start.localeCompare(b.week_start));
    return weeks.find(w => w.week_start <= today && today <= w.week_end)
        || weeks.filter(w => w.week_start <= today).pop()
        || weeks[0] || null;
  }

  function fmtRange(a, b){
    const o = {month:'short', day:'numeric'};
    const pa = new Date(a + 'T12:00:00'), pb = new Date(b + 'T12:00:00');
    return pa.toLocaleDateString(undefined, o) + ' – ' + pb.toLocaleDateString(undefined, o);

  // Name used in lift-log.json. Plain variants feed the Strength Progression chart.
  function exerciseKey(b){
    const n = b.name.toLowerCase();
    if(n.startsWith('front squat')) return 'front squat';
    if(n.startsWith('pause squat')) return 'pause squat';
    if(n.startsWith('tempo')) return 'tempo squat';
    return b.lift;
  }

  // One slot per set; open-ended rows ("Max in 10 min", "Your call") get an Add-set button.
  function slotsFor(b){
    const out = [];
    b.rows.forEach((r, ri) => {
      const reps = typeof r.reps === 'number' ? r.reps : '';
      if(typeof r.sets === 'number'){
        for(let i = 0; i < r.sets; i++) out.push({ri, label:r.label, pct:r.pct, lb:r.lb, reps});
      } else {
        out.push({ri, label:r.label, pct:r.pct, lb:r.lb, reps, open:true,
          desc:`${r.sets} · ${r.reps}${typeof r.reps === 'number' ? (r.reps === 1 ? ' rep' : ' reps') : ''}${r.pct != null ? ' @' + r.pct + '%' : ''}${r.lb != null ? ' (' + r.lb + ' lb)' : ''}`});
      }
    });
    return out;
  }

  async function ghLogAppend(entries){
    const tok = store('lc.gh.token');
    if(!tok) throw new Error('Add your GitHub token in "Logging setup" below first.');
    const url = `https://api.github.com/repos/${REPO}/contents/data/lift-log.json`;
    const H = {Authorization:`Bearer ${tok}`, Accept:'application/vnd.github+json'};
    for(let attempt = 0; attempt < 3; attempt++){
      const g = await fetch(url + '?ref=main&t=' + Date.now(), {headers:H, cache:'no-store'});
      if(!g.ok) throw new Error(`GitHub read failed (${g.status}). Check the token.`);
      const j = await g.json();
      const cur = JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\n/g, '')))) || '[]');
      const next = cur.concat(entries);
      const body = {message:`Log lifts ${todayStr()}`, sha:j.sha, branch:'main',
                    content: btoa(unescape(encodeURIComponent(JSON.stringify(next) + '\n')))};
      const p = await fetch(url, {method:'PUT', headers:{...H, 'Content-Type':'application/json'}, body:JSON.stringify(body)});
      if(p.ok) return next;
      if(p.status !== 409 && p.status !== 422) throw new Error(`GitHub save failed (${p.status}). Check the token has Contents write access.`);
    }
    throw new Error('GitHub save conflicted. Try again.');
  }

      <div class="card">
        <div style="font-size:13px; font-weight:700;">Share your week — Week ${SUMMARY.week} summary</div>
        <div class="share-txt">${escapeHtml(SUMMARY.text)}</div>
        <div class="share-row">
          ${navigator.share ? '<button class="save-btn" id="shareBtn">Share…</button>' : ''}
          <button class="save-btn" id="copyBtn">Copy text</button>
        </div>
        <div class="note" id="shareMsg" style="text-align:center;"></div>
      </div>`;
  }
  function wireShare(){
    const msgEl = document.getElementById('shareMsg');
    const sb = document.getElementById('shareBtn');
    if(sb) sb.addEventListener('click', async () => { try{ await navigator.share({text: SUMMARY.text}); }catch(e){} });
    const cb = document.getElementById('copyBtn');
    if(cb) cb.addEventListener('click', async () => {
      try{ await navigator.clipboard.writeText(SUMMARY.text); msgEl.textContent = 'Copied ✓'; }
      catch(e){ msgEl.textContent = 'Copy failed — press and hold the text to copy it.'; }
    });
  }

  function renderWorkouts(w, liftLog){
    if(liftLog) LIFT_LOG = liftLog;
    const el = document.getElementById('workoutsBody');
    if(!w){
      el.innerHTML = `<div class="card"><div class="empty"><span class="emoji">🗓️</span>No workouts generated yet. They're built every Saturday at 11:30 PM.</div></div>`;
      return;
    }
    if(w.status !== 'active'){
      el.innerHTML = shareCardHtml() + `<div class="card"><div class="empty"><span class="emoji">🏁</span>${escapeHtml(w.message || 'No program this week.')}</div></div>`;
      wireShare();
      return;
    }
    const key = `lc.session.${w.week_start}`;
    let sel = parseInt(store(key) || '0', 10);
    if(!sel){ const next = w.sessions.find(x => !isDone(w, x.id)); sel = next ? next.id : 1; }
    let msg = '';

    const draw = () => {
      const s = w.sessions.find(x => x.id === sel) || w.sessions[0];
      const done = isDone(w, s.id);
      const d = loadDraft(w, s.id);
      const blockState = (bi) => (d[bi] = d[bi] || {sets:{}, extra:[], record:''});

      const blocksHtml = s.main.map((b, bi) => {
        const st = blockState(bi);
        const slots = slotsFor(b);
        let last = null, n = 0, rows = '';
        const inputRow = (cls, val, ph, attrs) => `<input class="in ${cls}" type="number" inputmode="decimal" value="${val ?? ''}" placeholder="${ph}" ${attrs}>`;
        const setRow = (v, plan, attrs, num) => `
          <tr class="${v.done ? 'ok' : ''}${v.saved ? ' saved' : ''}">
            <td>${num}</td><td>${plan.pct != null ? plan.pct + '%' : '—'}</td>
            <td>${inputRow('w', v.w ?? plan.lb, 'lb', attrs)}</td>
            <td>${inputRow('r', v.r ?? plan.reps, 'reps', attrs)}</td>
            <td><button class="tick ${v.done ? 'on' : ''}" ${attrs} ${v.saved ? 'disabled' : ''}>${v.saved ? '✓' : v.done ? '✓' : ''}</button></td>
          </tr>`;
        slots.forEach((sl, si) => {
          if(sl.label && sl.label !== last) rows += `<tr class="grp"><td colspan="5">${escapeHtml(sl.label)}</td></tr>`;
          last = sl.label || null;
          if(sl.open){
            rows += `<tr class="desc"><td colspan="5">${escapeHtml(sl.desc)}</td></tr>`;
            st.extra.forEach((x, xi) => { if(x.ri === sl.ri){ n++; rows += setRow(x, sl, `data-b="${bi}" data-x="${xi}"`, n); } });
            rows += `<tr><td colspan="5"><button class="add" data-b="${bi}" data-ri="${sl.ri}" data-si="${si}">+ Add set</button></td></tr>`;
          } else {
            n++; rows += setRow(st.sets[si] || {}, sl, `data-b="${bi}" data-s="${si}"`, n);
          }
        });
        return `
          <div class="lift-block">
            <div class="lift-head"><div class="nm">${escapeHtml(b.name)}</div><div class="rest">Rest ${escapeHtml(b.rest)}</div></div>
            <table class="sets log">
              <thead><tr><th>Set</th><th>%</th><th>Lb</th><th>Reps</th><th class="r">Done</th></tr></thead>
              <tbody>${rows}</tbody>
            </table>
            ${b.note ? `<div class="note">${escapeHtml(b.note)}</div>` : ''}
            ${b.record ? `<div class="record">${escapeHtml(b.record)}: <input class="in rec" data-b="${bi}" type="number" inputmode="decimal" value="${escapeHtml(st.record || '')}" ${st.recordSaved ? 'disabled' : ''}></div>` : ''}
          </div>`;
      }).join('');

      const getPending = () => {
        const pending = [];
      s.main.forEach((b, bi) => {
          const st = blockState(bi), slots = slotsFor(b);
          Object.entries(st.sets).forEach(([si, v]) => { if(v.done && !v.saved) pending.push({b, bi, v, pct: slots[si] ? slots[si].pct : null}); });
          st.extra.forEach(v => { if(v.done && !v.saved) pending.push({b, bi, v, pct: (b.rows[v.ri] || {}).pct}); });
          if(b.record && st.record !== '' && st.record != null && !st.recordSaved) pending.push({b, bi, record:true});
        });
        return pending;
      };
      const pending = getPending();
      const hasTok = !!store('lc.gh.token');

      el.innerHTML = shareCardHtml() + `
        <div class="card">
          <div class="wk-head">
            <div>
              <div class="t">Week ${w.week} of ${w.weeks_total} — ${escapeHtml(w.theme)}</div>
              <div class="d">${fmtRange(w.week_start, w.week_end)} · do sessions in order, any 4 days</div>
            </div>
            <span class="phase-tag">${w.sessions.filter(x => isDone(w, x.id)).length}/4</span>
          </div>
        </div>

        <div class="chips">
          ${w.sessions.map(x => `
            <button class="chip ${x.id === sel ? 'active' : ''} ${isDone(w, x.id) ? 'done' : ''}" data-id="${x.id}">
              <div class="n">${x.id}</div>
              <div class="l">${escapeHtml(x.title.split('—')[1] || '').trim()}</div>
            </button>`).join('')}
        </div>

        <div class="card">
          <div style="font-size:17px; font-weight:800;">${escapeHtml(s.title)}</div>
          <div class="note" style="margin:2px 0 14px;">${escapeHtml(s.focus)} · edit the weight or reps if you did something different, then tap Done</div>
          ${blocksHtml}
          <button class="save-btn" id="saveBtn" ${pending.length ? '' : 'disabled'}>${pending.length ? `Save ${pending.length} to lift log` : 'Tap Done on sets to log them'}</button>
          ${msg ? `<div class="note" style="text-align:center;">${msg}</div>` : ''}
        </div>

        ${s.accessories.length ? `
        <div class="card">
          <div style="font-size:13px; font-weight:700; margin-bottom:6px;">Accessories</div>
          ${s.accessories.map(a => `<div class="workout-item"><div class="t">${escapeHtml(a.name)}</div><div class="m">${escapeHtml(a.scheme)}</div></div>`).join('')}
        </div>` : ''}

        <div class="card">
          <div style="font-size:13px; font-weight:700; margin-bottom:6px;">Finisher</div>
          ${s.finisher.map(a => `<div class="workout-item"><div class="t">${escapeHtml(a.name)}</div><div class="m">${escapeHtml(a.scheme)}</div></div>`).join('')}
        </div>

        <button class="done-btn ${done ? 'on' : ''}" id="doneBtn">${done ? '✓ Session done' : 'Mark session done'}</button>

        <div class="card" style="margin-top:12px;">
          <div style="font-size:13px; font-weight:700; margin-bottom:6px;">Swim · bike · run this week (2–3 sessions)</div>
          ${w.conditioning.map(c => `<div class="workout-item"><div><div class="t">${escapeHtml(c.mode)}</div><div class="m">${escapeHtml(c.timing)}</div></div><div class="m" style="text-align:right; max-width:55%;">${escapeHtml(c.session)}</div></div>`).join('')}
        </div>

        <div class="card">
          <div style="font-size:13px; font-weight:700; margin-bottom:6px;">Rules</div>
          <ul class="rules">${w.rules.map(r => `<li>${escapeHtml(r)}</li>`).join('')}</ul>
          <div class="note" style="margin-top:10px;">Maxes: squat ${w.maxes_lb.squat} · bench ${w.maxes_lb.bench} · deadlift ${w.maxes_lb.deadlift} · OHP ${w.maxes_lb.ohp} · incline ${w.maxes_lb.incline} lb</div>
        </div>

        <div class="card">
          <div style="font-size:13px; font-weight:700; margin-bottom:6px;">Logging setup</div>
          ${hasTok
            ? `<div class="note" style="margin-top:0;">Connected to GitHub on this device ✓</div><button class="link-btn" id="tokDel">Remove token from this device</button>`
            : `<div class="note" style="margin-top:0;">To save sets to your lift log, paste a GitHub fine-grained token for life-coach-data (Contents: read and write). It's stored only in this browser.</div>
               <input class="in tok" id="tokIn" type="password" placeholder="github_pat_…" autocomplete="off">
               <button class="save-btn" id="tokSave" style="margin-top:8px;">Save token on this device</button>`}
        </div>`;

      // --- events
      wireShare();
      const upd = (t, fn) => { const bi = +t.dataset.b, st = blockState(bi); fn(st, t); saveDraft(w, s.id, d); };
      const slotOf = (st, t) => t.dataset.x != null ? st.extra[+t.dataset.x] : (st.sets[+t.dataset.s] = st.sets[+t.dataset.s] || {});
      el.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => { sel = +c.dataset.id; store(key, String(sel)); msg = ''; draw(); }));
      el.querySelectorAll('input.w, input.r').forEach(i => i.addEventListener('change', () =>
        upd(i, (st, t) => { const v = slotOf(st, t); v[t.classList.contains('w') ? 'w' : 'r'] = t.value === '' ? null : Number(t.value); })));
      el.querySelectorAll('input.rec').forEach(i => i.addEventListener('change', () => { upd(i, st => { st.record = i.value; }); draw(); }));
      el.querySelectorAll('button.tick').forEach(btn => btn.addEventListener('click', () => {
        const tr = btn.closest('tr');
        upd(btn, (st, t) => {
          const v = slotOf(st, t);
          v.w = Number(tr.querySelector('input.w').value) || null;
          v.r = Number(tr.querySelector('input.r').value) || null;
          v.done = !v.done;
        });
        draw();
      }));
      el.querySelectorAll('button.add').forEach(btn => btn.addEventListener('click', () => {
        upd(btn, st => { const sl = slotsFor(s.main[+btn.dataset.b])[+btn.dataset.si]; st.extra.push({ri:+btn.dataset.ri, w:sl.lb, r:sl.reps || null}); });
        draw();
      }));
      document.getElementById('doneBtn').addEventListener('click', () => {
        store(`lc.done.${w.week_start}.${s.id}`, isDone(w, s.id) ? null : '1'); draw();
      });
      const tokSave = document.getElementById('tokSave');
      if(tokSave) tokSave.addEventListener('click', () => { const v = document.getElementById('tokIn').value.trim(); if(v){ store('lc.gh.token', v); msg = 'Token saved on this device.'; draw(); } });
      const tokDel = document.getElementById('tokDel');
      if(tokDel) tokDel.addEventListener('click', () => { store('lc.gh.token', null); draw(); });

      document.getElementById('saveBtn').addEventListener('click', async (ev) => {
        ev.target.disabled = true; ev.target.textContent = 'Saving…';
        const today = todayStr();
        const pending = getPending();
        const entries = pending.map(p => p.record
          ? {date:today, exercise:`${exerciseKey(p.b)} — ${p.b.record.toLowerCase()}`, value:Number(blockState(p.bi).record), week:w.week, session:s.id}
          : {date:today, exercise:exerciseKey(p.b), weight_lb:p.v.w, reps:p.v.r, pct:p.pct ?? null, week:w.week, session:s.id});
        try{
          LIFT_LOG = await ghLogAppend(entries);
          pending.forEach(p => { if(p.record) blockState(p.bi).recordSaved = true; else p.v.saved = true; });
          saveDraft(w, s.id, d);
          store(`lc.done.${w.week_start}.${s.id}`, '1');
          msg = `Saved ${entries.length} to your lift log ✓`;
          try{ renderLifts(LIFT_LOG); }catch(e){}
        }catch(e){ msg = '⚠️ ' + escapeHtml(e.message); }
        draw();
      });
    };
    draw();
  }

  init();
})();
</script>

</body>
</html>
